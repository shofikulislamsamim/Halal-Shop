<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Admin Panel | Halal Shop</title>
  </head>
  <body class="bg-[#FAFAF7]">
    <div id="admin-root"></div>
    <div id="admin-startup-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FAFAF7;color:#1c1917;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
      <div style="width:100%;max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5e4;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)">
        <div style="font-size:34px;margin-bottom:10px">🔐</div>
        <div style="font-size:20px;font-weight:800;color:#064E3B">Halal Shop Admin</div>
        <div id="admin-startup-status" style="margin-top:8px;color:#78716c">অ্যাডমিন প্যানেল লোড হচ্ছে…</div>
        <button id="admin-startup-reload" type="button" style="display:none;margin-top:16px;border:0;border-radius:10px;padding:10px 18px;background:#065F46;color:#fff;font-weight:700;cursor:pointer">আবার লোড করুন</button>
        <pre id="admin-startup-error" style="display:none;margin-top:16px;text-align:left;white-space:pre-wrap;word-break:break-word;padding:12px;background:#f5f5f4;border-radius:10px;font-size:12px;color:#7f1d1d"></pre>
      </div>
    </div>
    <script>
      (() => {
        const fallback = document.getElementById('admin-startup-fallback');
        const status = document.getElementById('admin-startup-status');
        const errorBox = document.getElementById('admin-startup-error');
        const reload = document.getElementById('admin-startup-reload');
        const showError = (message) => {
          if (status) status.textContent = 'অ্যাডমিন প্যানেল লোড হতে পারেনি।';
          if (errorBox) {
            errorBox.style.display = 'block';
            errorBox.textContent = String(message || 'Unknown startup error');
          }
          if (reload) reload.style.display = 'inline-block';
        };
        window.__halalShopAdminStartupError = showError;
        window.addEventListener('error', (event) => showError(event?.error?.stack || event?.message || 'JavaScript startup error'));
        window.addEventListener('unhandledrejection', (event) => showError(event?.reason?.stack || event?.reason?.message || event?.reason || 'Unhandled promise rejection'));
        if (reload) reload.addEventListener('click', () => window.location.reload());
      })();
    </script>
    <script type="module" src="./src/admin-main.tsx"></script>
  </body>
</html>
