    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Halal Shop" />

    <meta property="og:description" content="বিশ্বস্ত হালাল পণ্য, সহজ অর্ডার এবং হোম ডেলিভারি।" />
    <meta property="og:image" content="https://shofikulislamsamim.github.io/Halal-Shop/halal-shop-logo.jpg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Halal Shop | বিশ্বস্ত পণ্য, সহজ কেনাকাটা" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="./halal-shop-logo.jpg" />
  </head>
  <body class="bg-stone-50 text-stone-800 antialiased font-sans">
    <div id="root"></div>
    <div id="app-startup-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FAFAF7;color:#1c1917;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
      <div style="width:100%;max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5e4;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)">
        <div style="font-size:34px;margin-bottom:10px">🛍️</div>
        <div style="font-size:20px;font-weight:800;color:#064E3B">Halal Shop</div>
        <div id="app-startup-status" style="margin-top:8px;color:#78716c">ওয়েবসাইট লোড হচ্ছে…</div>
        <button id="app-startup-reload" type="button" style="display:none;margin-top:16px;border:0;border-radius:10px;padding:10px 18px;background:#065F46;color:#fff;font-weight:700;cursor:pointer">আবার লোড করুন</button>
        <pre id="app-startup-error" style="display:none;margin-top:16px;text-align:left;white-space:pre-wrap;word-break:break-word;padding:12px;background:#f5f5f4;border-radius:10px;font-size:12px;color:#7f1d1d"></pre>
      </div>
    </div>
    <script>
      (() => {
        const fallback = document.getElementById('app-startup-fallback');
        const status = document.getElementById('app-startup-status');
        const errorBox = document.getElementById('app-startup-error');
        const reload = document.getElementById('app-startup-reload');
        const showError = (message) => {
          if (!fallback) return;
          if (status) status.textContent = 'Halal Shop লোড হতে পারেনি।';
          if (errorBox) {
            errorBox.style.display = 'block';
            errorBox.textContent = String(message || 'Unknown startup error');
          }
          if (reload) reload.style.display = 'inline-block';
        };
        window.__halalShopStartupError = showError;
        window.addEventListener('error', (event) => {
          const message = event?.error?.stack || event?.message || 'JavaScript startup error';
          showError(message);
        });
        window.addEventListener('unhandledrejection', (event) => {
          showError(event?.reason?.stack || event?.reason?.message || event?.reason || 'Unhandled promise rejection');
        });
        if (reload) reload.addEventListener('click', () => window.location.reload());
      })();
    </script>
    <script type="module" src="/Halal-Shop/src/main.tsx"></script>
  </body>
</html>
